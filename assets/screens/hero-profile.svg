<svg xmlns="http://www.w3.org/2000/svg" width="260" height="548" viewBox="0 0 260 548" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Simplified knowledge profile visual</title>
  <desc id="desc">An abstract cyan knowledge map, Pulmonology as the next learning focus, and Practice, Read, and Watch options. This is an illustrative interface concept.</desc>
  <defs>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(140 216) rotate(90) scale(210 166)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C2835"/>
      <stop offset="1" stop-color="#070C14"/>
    </radialGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(135 233) rotate(90) scale(118)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#62ECD9" stop-opacity=".14"/>
      <stop offset=".68" stop-color="#42B6C9" stop-opacity=".05"/>
      <stop offset="1" stop-color="#42B6C9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="map" x1="68" y1="163" x2="176" y2="303" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BAFFF1"/>
      <stop offset=".55" stop-color="#62E6E2"/>
      <stop offset="1" stop-color="#6DAAFE"/>
    </linearGradient>
    <linearGradient id="mapFill" x1="111" y1="150" x2="147" y2="309" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76FCE1" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7EB5FF" stop-opacity=".02"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="260" height="548" fill="url(#ambient)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="22" y="53" fill="#B5C3D1" font-size="10" font-weight="600" letter-spacing="2.3">MEDQ·AI</text>
    <circle cx="234" cy="49" r="3" fill="#8FF4DE"/>
    <text x="22" y="95" fill="#F3F8FA" font-size="23" font-weight="500" letter-spacing="-1">Your knowledge.</text>
    <circle cx="130" cy="236" r="122" fill="url(#halo)"/>
    <g stroke="#79B0C0" stroke-opacity=".13" stroke-width=".75">
      <path d="M130 140 213.1 188 213.1 284 130 332 46.9 284 46.9 188Z"/>
      <path d="M130 168 188.9 202 188.9 270 130 304 71.1 270 71.1 202Z"/>
      <path d="M130 196 164.6 216 164.6 256 130 276 95.4 256 95.4 216Z"/>
      <path d="M130 140V332M46.9 188 213.1 284M46.9 284 213.1 188"/>
    </g>
    <path d="M130 156 197 197 177 263 130 312 61 276 82 208Z" fill="url(#mapFill)" stroke="url(#map)" stroke-width="1.5" stroke-linejoin="round"/>
    <g stroke="url(#map)" stroke-opacity=".28" stroke-width=".75">
      <path d="M130 156 177 263 61 276 130 156ZM82 208 197 197 130 312 82 208ZM130 236 130 156M130 236 197 197M130 236 177 263M130 236 130 312M130 236 61 276M130 236 82 208"/>
    </g>
    <g fill="#91F2E5">
      <circle cx="130" cy="156" r="4" filter="url(#glow)"/>
      <circle cx="197" cy="197" r="4" filter="url(#glow)"/>
      <circle cx="61" cy="276" r="4" filter="url(#glow)"/>
      <circle cx="130" cy="156" r="2.5"/>
      <circle cx="197" cy="197" r="2.5"/>
      <circle cx="177" cy="263" r="2"/>
      <circle cx="130" cy="312" r="2.5"/>
      <circle cx="61" cy="276" r="2.5"/>
      <circle cx="82" cy="208" r="2"/>
      <circle cx="130" cy="236" r="2.5"/>
    </g>
    <text x="22" y="375" fill="#8CA8B5" font-size="10" font-weight="500" letter-spacing="1.5">NEXT FOCUS</text>
    <text x="22" y="405" fill="#F3F8FA" font-size="24" font-weight="500" letter-spacing="-.8">Pulmonology</text>
    <path d="M22 432H238" stroke="#A9D4E3" stroke-opacity=".12"/>
    <g stroke="#AECDD4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="41" y="455" width="18" height="21" rx="5"/>
      <path d="m45.5 465 3 3 5.5-6"/>
      <path d="M121 455.5c3.1-1 5.9-.8 9 1.5v19c-3.1-2.3-5.9-2.5-9-1.5ZM139 455.5c-3.1-1-5.9-.8-9 1.5v19c3.1-2.3 5.9-2.5 9-1.5Z"/>
      <circle cx="210" cy="466" r="11"/>
      <path d="m208 462 5.5 4-5.5 4Z" fill="#AECDD4" stroke="none"/>
